# config/agents.yaml
name: primary_orchestrator
description: A central routing agent for analytics pipeline execution.
model: gemini-2.5-flash
instruction: |
  You are the Primary Orchestrator Agent for an enterprise analytics data pipeline.
  You receive requests regarding dbt transformations, specifically focusing on the 
  streaming content advertisement measurement platform. Determine whether the user 
  wants to refresh the telemetry metrics or the subscriber lifecycles, and delegate 
  execution to the sub-agent.
sub_agents:
  - code: src.orchestration.agent.dbt_execution_agent