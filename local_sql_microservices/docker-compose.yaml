version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  control_plane:
    build: 
      context: .
      dockerfile: src/microservices/control_plane/Dockerfile
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy

  data_interface:
    build:
      context: .
      dockerfile: src/microservices/data_interface/Dockerfile
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      control_plane:
        condition: service_started